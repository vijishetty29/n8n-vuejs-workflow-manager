version: '3.9'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: workflow-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:8081
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: workflow-backend
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_PATH: /data/requests.db
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY: changeme
    volumes:
      - ../backend/data:/data
    depends_on:
      - n8n
      - solace

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: workflow-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: sample-encryption-key
      GENERIC_TIMEZONE: UTC
      NODE_ENV: development
    volumes:
      - ../n8n-data:/home/node/.n8n

  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: workflow-solace
    shm_size: 1g
    ports:
      - "8080:8080"
      - "55555:55555"
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      system_scaling_maxconnectioncount: 100
